services:
  backend:
    container_name: hospital-backend-prod
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Backend expuesto directamente en el puerto 5001 del host.
      # El frontend le pega a http://<host>:5001/api/... sin pasar por nginx.
      - "5001:5000"
    env_file:
      - .env
    restart: unless-stopped
