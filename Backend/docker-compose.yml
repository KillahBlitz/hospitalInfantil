services:
  backend:
    image: hospital-backend:${BACKEND_IMAGE_TAG:-devel}
    container_name: ${BACKEND_CONTAINER_NAME:-hospital-backend}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-8081}:5000"
    env_file:
      - .env
    restart: unless-stopped