services:
  frontend:
    container_name: hospital-frontend-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      # Expone el frontend en el puerto 5000 del host. Las llamadas a /api
      # las hace pasar nginx (reverse proxy) al contenedor hospital-backend-prod:5000.
      - "5000:80"
    env_file:
      - .env
    networks:
      - hospital-net-prod
    restart: unless-stopped

networks:
  hospital-net-prod:
    name: hospital-net-prod
    external: true
