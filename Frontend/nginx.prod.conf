server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Resolver DNS embebido de Docker (127.0.0.11).
    # Con ipv6=off evitamos que nginx intente resolver AAAA (falla con "host not found" en algunos setups).
    # valid=10s hace que nginx re-resuelva cada 10s (útil si el backend se reinicia).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rutas SPA: cualquier ruta no encontrada devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy hacia el backend a través de la red compartida de Docker.
    # Al usar una VARIABLE en proxy_pass, nginx difiere la resolución DNS hasta el momento
    # de la petición. Esto evita que el contenedor muera al arrancar si el backend aún
    # no está listo, y permite recuperación automática ante reinicios del backend.
    location /api/ {
        set $backend_upstream "hospital-backend-prod";
        proxy_pass         http://$backend_upstream:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }
}
