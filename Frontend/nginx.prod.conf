server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Resolver DNS embebido de Docker (127.0.0.11).
    # Con ipv6=off evitamos que nginx intente resolver AAAA (falla con "host not found" en algunos setups).
    # valid=10s hace que nginx re-resuelva cada 10s (útil si el backend se reinicia).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend en variable para forzar resolución DNS en tiempo de request y no en el arranque.
    set $backend_upstream "hospital-backend-prod";

    # Rutas SPA: cualquier ruta no encontrada devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy hacia el backend para llamadas del API.
    location /api/ {
        proxy_pass         http://$backend_upstream:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }

    # Swagger UI y su spec OpenAPI (útil para pruebas en prod).
    # UseSwaggerUI() de .NET sirve en /swagger y UseSwagger() en /swagger/v1/swagger.json.
    location /swagger {
        proxy_pass         http://$backend_upstream:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }

    # Endpoint OpenAPI generado por MapOpenApi() (por defecto /openapi/v1.json).
    location /openapi {
        proxy_pass         http://$backend_upstream:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }
}
