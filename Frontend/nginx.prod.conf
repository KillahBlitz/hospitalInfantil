server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rutas SPA: cualquier ruta no encontrada devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy hacia el backend a través de la red compartida de Docker
    # El backend se resuelve por el nombre del contenedor (hospital-backend-prod) en el puerto interno 5000
    location /api/ {
        proxy_pass         http://hospital-backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }
}
