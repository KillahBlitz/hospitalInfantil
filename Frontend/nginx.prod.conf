server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rutas SPA: cualquier ruta no encontrada devuelve index.html
    # (necesario para que react-router funcione al recargar rutas anidadas)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
