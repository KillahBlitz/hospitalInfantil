name: Deploy to Devel

on:
  push:
    branches:
      - devel

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: ⚙️ Preparar variables de entorno
        run: |
          # Copia los archivos desde la raíz del repo a sus respectivas carpetas
          # Los renombramos a ".env" para que docker-compose los detecte automáticamente
          cp ~/.env.frontend ./Frontend/.env
          cp ~/.env.backend ./Backend/.env

      - name: 🚀 Desplegar Backend (C#)
        run: |
          cd ./Backend

          if docker ps -a --format '{{.Names}}' | grep -qx 'hospital-backend'; then
            docker rm -f hospital-backend
          fi

          docker compose up -d --build --remove-orphans

      - name: 🚀 Desplegar Frontend (React)
        run: |
          cd ./Frontend
          docker rm -f myeconomy-frontend || true
          docker compose up -d --build --remove-orphans

